<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mini Task Manager</title>

    <!-- conectar los estilos del css -->
    <link rel="stylesheet" href="css/styles.css" />

    <!-- conectar lógica del js  -->
    <link rel="stylesheet" href="js/app.js" />
  </head>
  <body>
    <main>
        <header>
            <h1>Mini Task Manager</h1>
            <p>Organiza tus activiades diarias</p>
        </header>
        <section>
            <h2>Nueva Tarea</h2>
            <form id = "task-form">
                <label for="task-input">Nombre de la Tarea:</label>
                <input type = "text" id = "task-input" placeholder = "Escribe una tarea" required>
                <button type = "submit">Agregar Tarea</button>
            </form>
        </section>
        <section>
            <h2>Mis Tareas</h2>
            <ul id = "task-list"></ul>
        </section>
    </main>
  </body>
</html>
